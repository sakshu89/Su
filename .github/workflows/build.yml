name: Build YMusic Android APK

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch: # run manually from the Actions tab

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same NDK the project pins (androidApp ndkVersion); :quickjs and :mse CMake builds honor ANDROID_NDK_ROOT.
  NDK_VERSION: 28.2.13676358

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # :engine-js bundles the scrape engine with npm/esbuild/tsc.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # Self-healing: applies the three source fixes if the repo does not have them yet (idempotent;
      # does nothing once the fixed files are committed). Safe to delete after that.
      - name: Apply build fixes if missing
        run: |
          python3 - <<'PY'
          def patch(path, marker, pairs):
              s = open(path, encoding="utf-8").read()
              if marker in s:
                  print("already fixed", path)
                  return
              o = s
              for old, new in pairs:
                  if old in s:
                      s = s.replace(old, new, 1)
              if s != o:
                  open(path, "w", encoding="utf-8").write(s)
                  print("patched", path)

          patch("commonUi/src/commonMain/kotlin/io/ymusic/ui/NowPlaying.kt", "lyricsUriHandler", [
              ("LocalUriHandler.current.openUri(lyricsSearchUrl(item))", "lyricsUriHandler.openUri(lyricsSearchUrl(item))"),
              ("                if (lyricsOpen) {\n                    SkeletonLyricsScreen(",
               "                if (lyricsOpen) {\n                    val lyricsUriHandler = LocalUriHandler.current\n                    SkeletonLyricsScreen("),
              ("    val uriHandler = LocalUriHandler.current\n\n    Box(\n        Modifier.fillMaxSize().background(Color.Black),",
               "    val uriHandler = LocalUriHandler.current\n    val accent = DesignColors.Accent\n\n    Box(\n        Modifier.fillMaxSize().background(Color.Black),"),
              ("color = DesignColors.Accent.copy(alpha = 0.10f),", "color = accent.copy(alpha = 0.10f),"),
          ])
          patch("buildSrc/src/main/kotlin/FfmpegBuild.kt", "allowMissing", [
              ("    @get:Input abstract val ffmpegBuildRoot: Property<String>\n",
               "    @get:Input abstract val ffmpegBuildRoot: Property<String>\n\n    @get:Input abstract val allowMissing: Property<Boolean>\n"),
              ("            check(packLooksPresent(pack)) {\n",
               "            if (!packLooksPresent(pack) && allowMissing.getOrElse(false)) {\n"
               "                logger.warn(\"ffmpeg: no pack for $slug at $pack - skipped\")\n"
               "                continue\n            }\n            check(packLooksPresent(pack)) {\n"),
          ])
          patch("build.gradle.kts", "allowMissing", [
              ("        ffmpegBuildRoot.set(FfmpegBuild.root(project).absolutePath)\n",
               "        ffmpegBuildRoot.set(FfmpegBuild.root(project).absolutePath)\n"
               "        allowMissing.set(project.findProperty(\"production\")?.toString() != \"true\")\n"),
          ])
          PY

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # No ffmpeg-build checkout here, so the ffmpeg packs are skipped with a warning (debug builds only);
      # the APK builds but ffmpeg-dependent features are unavailable. Release builds (-Pproduction=true)
      # still require every pack, see release.yml.
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YMusic-Debug-APK
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/**
            **/build/reports/**
          if-no-files-found: ignore
